name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pz7-docker/services/auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

  test-tasks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pz7-docker/services/tasks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-auth, test-tasks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth image
        run: docker build -t techip-auth:${{ github.sha }} .
        working-directory: pz7-docker/services/auth

      - name: Build tasks image
        run: docker build -t techip-tasks:${{ github.sha }} .
        working-directory: pz7-docker/services/tasks
